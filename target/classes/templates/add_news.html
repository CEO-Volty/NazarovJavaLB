<!DOCTYPE html>
<html lang="en">
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style_admin.css">
    <link rel="stylesheet" href="css/style_head.css">
    <link rel="stylesheet" href="css/style_orders.css">
    <title>Новости | AddinFab</title>
</head>

<body>



<div id="general_grid">

    <div id="Menu-bloc">

        <div id="Menu_logo">
            <img src="images/logo.png" alt="Логотип компании">

        </div>

        <div class="nav">
            <div class="drop">
                <button class="but-nav">&#9776</button>
                <div class="nav-list">
                    <a href="/main">Главная</a>
                    <a href="/settings">Настройки</a>
                    <a href="/news">Новости</a>
                    <a href="/main">База знаний</a>
                    <a href="/main">Связаться с нами</a>
                    <a href="/main">Услуги</a>
                    <a href="/Index">Выход</a>
                </div>



            </div>
        </div>




    </div>



    <div id="conteiner_bottom">

        <div id="Menu-bloc_column">
            <div class = "nav_column">
                <div class="nav-list_column">
                    <a href="/main">Заказы</a>
                    <a href="/material">Материалы</a>
                    <a href="/main">Оборудование</a>
                    <a href="/main">Рабочие графики</a>
                    <a href="/main">Персонал</a>
                    <a href="/main">Пользователи</a>
                    <a href="/main">Отчеты</a>
                </div>
            </div>





        </div>

        <div id="Orders_conteiner">
            <h1>Добавление новости</h1>
            <a href="/news">Вернуться</a>
            <form th:action="@{/add_news}" method="post" th:object="${news}">
                <label>Заголовок:</label>
                <input type="text" th:field="*{title}" required><br>
                <label>Текст:</label>
                <input type="text" th:field="*{content}"  required><br>


                <input type="submit" name="submit" value="Добавить">
            </form>



        </div>

    </div>


</div>

</body>

</html>
