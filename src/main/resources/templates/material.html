      <div class="nav">

              <a href="/settings">Настройки</a>

      <div class = "nav_column">
          <div class="nav-list_column">
          <a href="/Addinfab.ru/orders.php">Заказы</a>

    <div id="Orders_conteiner">
        <h1>Материалы</h1>
        <a href="/add_material">Добавить материал</a>
        <div id="table">
            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Наименование</th>
                    <th>Материал</th>
                    <th>Цвет</th>
                    <th>Наличие</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="material : ${materials}">
                    <td th:text="${material.id}"></td>
                    <td th:text="${material.title}"></td>
                    <td th:text="${material.material_name}"></td>
                    <td th:text="${material.color}"></td>
                    <td th:text="${material.weight}"></td>
                    <td>
                        <a th:href="@{/edit_material/{id}(id=${material.id})}" class="btn btn-warning">Редактировать</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        
    </div>
